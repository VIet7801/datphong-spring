spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/vivu}
    username: ${SPRING_DATASOURCE_USERNAME:vephim}
    password: ${SPRING_DATASOURCE_PASSWORD:hoclaptrinh@2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      batchsize: 50
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:hoclaptrinh@2026}
      database: ${SPRING_DATA_REDIS_DATABASE:1}

app:
  name: datphong
  version: 1.0.0-SNAPSHOT
  page:
    default-size: 20
    max-size: 100

redis:
  timeout:
    millis: 2000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:vephim}
  secretKey: ${MINIO_SECRET_KEY:hoclaptrinh@2026}
  bucket: ${MINIO_BUCKET:vivu-bucket}
  region: ${MINIO_REGION:us-east-1}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
logging:
  level:
    org.hibernate.orm.jdbc.error: 'OFF'
jwt:
    secret: ${JWT_SECRET:l75KeZzOvj59cLmq0/toOfAG8IfadlSm6au8JME4Qyw=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
